  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var $ = function (id) { return document.getElementById("f06-listening-score-" + id); };

      var watch = $("watch");
      var eyebrow = $("eyebrow");
      var arc = $("arc");
      var marker = $("marker");
      var num = $("num");
      var grade = $("grade");
      var label = $("label");
      var words = $("caption").querySelectorAll(".f06-listening-score-w");
      var rows = $("burst").querySelectorAll(".f06-listening-score-row");

      // svg-path-draw setup: measured length, dash pattern hides the whole stroke.
      var len = arc.getTotalLength();
      arc.style.strokeDasharray = String(len);
      arc.style.strokeDashoffset = String(len);

      var SCORE = 82;
      var COUNT_AT = 0.45;
      var COUNT_DUR = 1.25;
      var COUNT_EASE = "power2.out"; // shared by arc draw, marker travel and count — one chord

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.96s): watch holds centre, gauge draws, number counts ----
      tl.fromTo(watch, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" }, 0);
      tl.fromTo(eyebrow, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.15);

      // arc draws itself (full 270°)
      tl.to(arc, { strokeDashoffset: 0, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);

      // marker travels along the drawn arc to the value; number counts 0→82 (no scale growth)
      var state = { p: 0 };
      var startPt = arc.getPointAtLength(0);
      marker.setAttribute("cx", startPt.x.toFixed(2));
      marker.setAttribute("cy", startPt.y.toFixed(2));
      tl.to(
        state,
        {
          p: 1,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            num.textContent = String(Math.round(SCORE * state.p));
            var pt = arc.getPointAtLength(len * (SCORE / 100) * state.p);
            marker.setAttribute("cx", pt.x.toFixed(2));
            marker.setAttribute("cy", pt.y.toFixed(2));
          },
        },
        COUNT_AT
      );
      tl.fromTo(marker, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, COUNT_AT);
      tl.fromTo(num, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, COUNT_AT);

      // "Good" then "Listening Score" beneath the gauge
      tl.fromTo(grade, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.45);
      tl.fromTo(label, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.6);

      // ---- Scene 2 (1.96–3.44s): caption above the watch, per-word staggered reveal ----
      words.forEach(function (w, i) {
        tl.fromTo(
          w,
          { opacity: 0, y: 14, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power2.out" },
          2.05 + i * 0.1
        );
      });

      // ---- Scene 3 (3.44–4.907s): rows assemble center-outward into their slots ----
      var EXPAND_AT = 3.45;
      var EXPAND_DUR = 1.0;
      rows.forEach(function (el, i) {
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          {
            x: Number(el.dataset.targetX),
            y: Number(el.dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: EXPAND_DUR,
            ease: "power3.out",
          },
          EXPAND_AT + i * 0.06
        );
      });

      // subtle life on the number only — a single deterministic breath, no repeat/yoyo
      tl.to(num, { scale: 1.03, duration: 0.5, ease: "sine.inOut" }, 3.7);
      tl.to(num, { scale: 1.0, duration: 0.6, ease: "sine.inOut" }, 4.2);

      window.__timelines["06-listening-score"] = tl;
    })();
  </script>
