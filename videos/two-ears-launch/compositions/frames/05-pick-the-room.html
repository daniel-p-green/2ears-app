  <script>
    (function () {
      var FRAME_ID = "05-pick-the-room";
      var DURATION = 3.029;
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      var q = function (id) { return root.querySelector('[id="' + FRAME_ID + "-" + id + '"]'); };

      var stage = q("stage");
      var headline = q("headline");
      var glow = q("glow");
      var rows = root.getElementsByClassName(FRAME_ID + "-row");

      var tl = gsap.timeline({ paused: true });

      /* ── Scene 1 (0.0–~0.95s): the drawn watch holds at center from t=0;
         "Pick the room" arrives above it on the VO cue. A slow camera push-in
         (blueprint hold move) runs underneath for the whole shot. ── */
      tl.fromTo(
        stage,
        { scale: 1, transformOrigin: "50% 50%" },
        { scale: 1.03, duration: DURATION, ease: "none" },
        0
      );
      tl.fromTo(
        headline,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.15
      );

      /* ── Scene 2 (~0.95–2.8s): three rows assemble one per spoken word —
         center-outward-expansion, direct-into-slot (partially-spread start),
         each row sliding a short path into its own slot. Listen / Balanced /
         Presenting land on their VO cues. ── */
      var ROW_AT = [1.0, 1.6, 2.2];
      var EXPAND_DUR = 0.6;
      var START_PROGRESS = 0.35;
      for (var i = 0; i < rows.length; i++) {
        var el = rows[i];
        var tx = Number(el.getAttribute("data-target-x"));
        var ty = Number(el.getAttribute("data-target-y"));
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: tx * START_PROGRESS, y: ty * START_PROGRESS, scale: 0.82, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: tx, y: ty, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
          ROW_AT[i]
        );
      }

      /* ── Scene 3 (~2.55s–end): the list holds; the Listen circle glows once —
         ambient-glow-bloom, pulse-on-arrival form: bloom slightly past peak,
         then ease to a low steady hold. One pass, no loop. ── */
      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" },
        { opacity: 0.38, scale: 1.06, duration: 0.28, ease: "power2.out" },
        2.55
      );
      tl.to(glow, { opacity: 0.24, scale: 1, duration: 0.2, ease: "power1.inOut" }, 2.83);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
