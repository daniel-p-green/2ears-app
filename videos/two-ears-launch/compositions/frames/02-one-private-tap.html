  <script>
    (function () {
      var ID = "02-one-private-tap";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (part) {
        return root.querySelector('[data-part="' + part + '"]');
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      // dynamic-content-sequencing: per-token start times are computed ONCE at build from
      // token length (BASE + chars × SEC_PER_CHAR), never hand-typed and never in onUpdate.
      var BASE = 0.08;
      var SEC_PER_CHAR = 0.03;
      var ENTER = 0.5;
      function sequence(tokens, start) {
        var t = start;
        return tokens.map(function (el) {
          var s = t;
          t += BASE + el.textContent.length * SEC_PER_CHAR;
          return s;
        });
      }

      var watch = q("watch");
      var glow = q("glow");
      var parts = [q("band-top"), q("band-bottom"), q("case"), q("crown"), q("icon")];
      var faceLit = q("face-lit");
      var ring = q("ring");
      var wm = q("wm");
      var wmTokens = qa('[data-part="wm"] span');
      var lineTokens = qa('[data-part="line"] span');

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.4s): the wordmark arrives per-token, then scales down into the face lockup.
      var wmStarts = sequence(wmTokens, 0.06);
      wmTokens.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: ENTER, ease: "power3.out" },
          wmStarts[i]
        );
      });
      // Plain scale tween, no camera, no overshoot: the hero clears the center by becoming the small lockup.
      tl.to(wm, { scale: 0.26, y: 64, duration: 0.55, ease: "power2.inOut" }, 1.0);

      // ── Scene 2 (1.4–4.6s): watch fades in at center; glow rises behind it; ONE ring pulse; face brightens then settles.
      tl.fromTo(glow, { opacity: 0 }, { opacity: 0.28, duration: 0.9, ease: "power2.out" }, 1.45);
      tl.fromTo(parts, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.45);

      // "taps your wrist" — a single thin ring expands outward from the watch's center and fades.
      tl.fromTo(
        ring,
        { scale: 0.6, opacity: 0.55 },
        { scale: 4.2, opacity: 0, duration: 1.2, ease: "power2.out" },
        2.05
      );
      tl.fromTo(faceLit, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, 2.05);
      tl.to(faceLit, { opacity: 0.22, duration: 0.8, ease: "power2.inOut" }, 2.3);

      // ── Scene 3 (4.6s–end): the watch shrinks and slides up to the upper third; the closing line arrives beneath.
      tl.to(watch, { scale: 0.55, y: -240, duration: 0.75, ease: "power2.inOut" }, 4.55);

      var lineStarts = sequence(lineTokens, 4.75);
      lineTokens.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: ENTER, ease: "power3.out" },
          lineStarts[i]
        );
      });
      // Holds still to the end; the root transition owns the exit.

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
