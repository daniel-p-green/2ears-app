  <div id="root" data-composition-id="07-two-ears" data-width="1080" data-height="1080">

      <div id="07-two-ears-glow"></div>

      <div id="07-two-ears-lockup">
        <svg id="07-two-ears-mark" viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- left ear -->
          <g transform="translate(20 20)">
            <path class="ear-outer" d="M 170 5 C 265 5, 340 80, 340 178 L 340 330 C 340 405, 300 460, 240 460 C 196 460, 172 425, 155 375 C 135 330, 55 290, 22 235 C 6 208, 0 180, 0 150 C 0 62, 78 5, 170 5 Z" />
            <path class="ear-inner" d="M 85 178 C 85 88, 235 88, 235 178 L 235 270" />
            <path class="ear-hook" d="M 235 214 L 192 214 C 170 214, 160 238, 173 258 L 192 300" />
          </g>

            <path class="ear-outer" d="M 170 5 C 265 5, 340 80, 340 178 L 340 330 C 340 405, 300 460, 240 460 C 196 460, 172 425, 155 375 C 135 330, 55 290, 22 235 C 6 208, 0 180, 0 150 C 0 62, 78 5, 170 5 Z" />
            <path class="ear-inner" d="M 85 178 C 85 88, 235 88, 235 178 L 235 270" />
            <path class="ear-hook" d="M 235 214 L 192 214 C 170 214, 160 238, 173 258 L 192 300" />
          </g>

        <span class="line" id="07-two-ears-line2"><span class="w">Use</span> <span class="w">them</span> <span class="w">in</span> <span class="w">that</span> <span class="w">ratio.</span></span>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) { return document.getElementById(id); };
      var glow = byId("07-two-ears-glow");
      var lockup = byId("07-two-ears-lockup");
      var mark = byId("07-two-ears-mark");
      var word = byId("07-two-ears-word");
      var tile = byId("07-two-ears-tile");
      var line1 = byId("07-two-ears-line1");
      var line2 = byId("07-two-ears-line2");
      var platform = byId("07-two-ears-platform");

      var toArr = function (list) { return Array.prototype.slice.call(list); };
      var outers = toArr(mark.querySelectorAll(".ear-outer"));
      var inners = toArr(mark.querySelectorAll(".ear-inner"));
      var hooks = toArr(mark.querySelectorAll(".ear-hook"));
      var toks = toArr(word.querySelectorAll(".tok"));
      var words1 = toArr(line1.querySelectorAll(".w"));
      var words2 = toArr(line2.querySelectorAll(".w"));

      // svg-path-draw setup: measured lengths (slight overestimate), dash fully offset = invisible.
      outers.concat(inners, hooks).forEach(function (p) {
        var len = 0;
        try { len = p.getTotalLength(); } catch (e) { len = 0; }
        if (!len || !isFinite(len)) len = 2400;
        len = len * 1.03;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–~1.2s): glow blooms, two ears draw on, wordmark arrives ──
      var GLOW_PEAK = 0.32;
      tl.fromTo(glow,
        { opacity: 0, scale: 0.84 },
        { opacity: GLOW_PEAK, scale: 1, duration: 1.05, ease: "power2.out" },
        0.05);

      // both ears draw simultaneously (mirrored), segments staggered at ~75% of the previous
      tl.to(outers, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.05);
      tl.to(inners, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 0.5);
      tl.to(hooks, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.82);

      // wordmark: per-token staggered reveal beneath the mark
      tl.fromTo(toks,
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.1 },
        0.85);

      // bounded glow breathe through the hold (finite phase tween, never yoyo)
      var phase = { p: 0 };
      var OP_AMP = 0.025;
      var SC_AMP = 0.012;
      tl.to(phase, {
        p: Math.PI * 2,
        duration: 2.74,
        ease: "none",
        onUpdate: function () {
          var s = Math.sin(phase.p);
          glow.style.opacity = String(GLOW_PEAK + s * OP_AMP);
          glow.style.transform = "scale(" + (1 + s * SC_AMP) + ")";
        }
      }, 1.1);

      // ── Scene 2 (~1.4–~2.9s): lockup settles into the upper third; tagline in two lines ──
      tl.to(lockup, { y: -140, duration: 0.6, ease: "power3.out" }, 1.4);

      tl.fromTo(words1,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.07 },
        1.65);

      tl.fromTo(words2,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.07 },
        2.3);

      // ── Scene 3 (~2.95s–end): platform line, app tile joins the wordmark, hold ──
      tl.fromTo(platform,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        2.95);

      // wordmark makes room; the rounded app tile pops in beside it
      tl.to(word, { x: 42, duration: 0.45, ease: "power3.out" }, 3.1);
      tl.fromTo(tile,
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" },
        3.1);

      // final frame: still lockup — no exit
      window.__timelines = window.__timelines || {};
      window.__timelines["07-two-ears"] = tl;
    })();
  </script>
