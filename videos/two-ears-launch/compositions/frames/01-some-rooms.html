<template>
  <style>
    /* Space Grotesk is the frame.md display face; no font files were staged in
       assets/fonts or capture/assets/fonts at dispatch, so this declaration binds
       the family name to a local install and degrades to a system sans. */
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 600;
      src: url("assets/fonts/Space_Grotesk_600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 700;
      src: url("assets/fonts/Space_Grotesk_700.woff2") format("woff2");
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }

    /* full-bleed ground — a clip layer, never painted on #root */
    [id="01-some-rooms-bg"] {
      position: absolute;
      inset: 0;
      background: #000000;
    }

    /* content layer: everything lives in the top 83% (0–896px) */
    [id="01-some-rooms-stage"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 896px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2cqw;
    }

    /* fixed line — display ramp h2, re-stepped for 1:1 */
    [id="01-some-rooms-fixed"] {
      display: flex;
      justify-content: center;
      gap: 0.32em;
      white-space: nowrap;
      font-size: 5.9cqw;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    [class~="01-some-rooms-word"] {
      display: inline-block;
      will-change: transform, opacity, filter;
    }

    /* slot row — height reserved at the h1 size so the fixed line never moves */
    [id="01-some-rooms-slot-row"] {
      height: 12.4cqw;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    [id="01-some-rooms-slot"] {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1.2cqw;
      white-space: nowrap;
    }
    [id="01-some-rooms-slot-word"] {
      display: block;
      text-align: center;
      font-size: 5.9cqw;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: #64d2ff; /* state 1: listening — primary */
      will-change: transform, opacity;
    }
    [id="01-some-rooms-slot"][data-state="2"] [id="01-some-rooms-slot-word"] {
      color: #ffffff; /* state 2: talking — text */
    }
    [id="01-some-rooms-slot"][data-state="3"] [id="01-some-rooms-slot-word"] {
      color: #ffffff; /* state 3: broadcasting — text, one step up the ramp (h1) */
      font-size: 9.6cqw;
      font-weight: 700;
      line-height: 1.08;
    }
    [id="01-some-rooms-underline"] {
      display: block;
      height: 2px;
      width: 100%;
      background: rgba(100, 210, 255, 0.2); /* border token */
      border-radius: 2px;
      transform-origin: left center;
      will-change: transform;
    }
  </style>

  <div
    id="root"
    data-composition-id="01-some-rooms"
    data-width="1080"
    data-height="1080"
    data-duration="5.413"
  >
    <div id="01-some-rooms-bg" class="clip" data-start="0" data-duration="5.413" data-track-index="0"></div>

    <div id="01-some-rooms-stage" class="clip" data-start="0" data-duration="5.413" data-track-index="1">
      <div id="01-some-rooms-fixed">
        <span class="01-some-rooms-word" id="01-some-rooms-w0">Some</span>
        <span class="01-some-rooms-word" id="01-some-rooms-w1">rooms</span>
        <span class="01-some-rooms-word" id="01-some-rooms-w2">are</span>
        <span class="01-some-rooms-word" id="01-some-rooms-w3">for</span>
      </div>
      <div id="01-some-rooms-slot-row">
        <div id="01-some-rooms-slot" data-state="1">
          <span id="01-some-rooms-slot-word"></span>
          <span id="01-some-rooms-underline"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "01-some-rooms";
      var DUR = 5.013;
      var LEAD = 0.04; // reveals ignite a hair before the spoken onset

      var $ = function (suffix) {
        return document.getElementById(ID + "-" + suffix);
      };

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;

      /* ---------- Scene 1: fixed line, per-word staggered reveal
         dynamic-content-sequencing: the word list + its VO cues are reduced ONCE
         into a flat TIMELINE of {start, end}; tweens are placed from it. ---------- */
      var WORDS = [
        { el: $("w0"), cue: 0.07 }, // "Some"
        { el: $("w1"), cue: 0.3 }, // "rooms"
        { el: $("w2"), cue: 0.67 }, // "are"
        { el: $("w3"), cue: 0.89 }, // "for"
      ];
      var WORD_TIMELINE = WORDS.map(function (w, i) {
        var start = Math.max(0, w.cue - LEAD);
        var next = WORDS[i + 1] ? Math.max(0, WORDS[i + 1].cue - LEAD) : start + 0.55;
        return { el: w.el, start: start, end: next };
      });
      WORD_TIMELINE.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, y: 28, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
          entry.start
        );
      });

      /* slot word "listening." lands last, in primary */
      var slotWrap = $("slot");
      var slotWord = $("slot-word");
      var underline = $("underline");
      var T_LISTEN = 1.11 - LEAD;

      tl.fromTo(
        slotWord,
        { opacity: 0, y: 34, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        T_LISTEN
      );

      /* ---------- discrete-text-sequence: the slot hard-cuts between whole
         states at time thresholds; reverse-search each frame, write DOM only
         when the state actually changes. ---------- */
      var T_TALK = 2.72 - LEAD; // VO "talking"
      var T_BROAD = 3.95 - LEAD; // VO "broadcasting"

      var SEQUENCE = [
        { t: 0.0, text: "listening.", state: "1" },
        { t: T_TALK, text: "talking.", state: "2" },
        { t: T_BROAD, text: "broadcasting.", state: "3" },
      ];

      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }

      var lastState = "";
      function applyState(entry) {
        if (entry.state === lastState) return;
        slotWord.textContent = entry.text;
        slotWrap.setAttribute("data-state", entry.state);
        lastState = entry.state;
      }
      applyState(SEQUENCE[0]);

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            applyState(stateAt(driver.t));
          },
        },
        0
      );

      /* ---------- Scene 2: "talking." — hairline underline draws left→right ---------- */
      tl.fromTo(
        slotWord,
        { scale: 0.96 },
        { scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false },
        T_TALK
      );
      tl.fromTo(
        underline,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        T_TALK + 0.02
      );

      /* ---------- Scene 3: "broadcasting." steps up to h1; fixed words dim to
         text-muted; the underline redraws to the new width. Holds to the cut. ---------- */
      tl.fromTo(
        slotWord,
        { scale: 0.94 },
        { scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false },
        T_BROAD
      );
      tl.to(
        WORDS.map(function (w) {
          return w.el;
        }),
        { opacity: 0.63, duration: 0.45, ease: "power2.out" }, // #A1A1A6 on black
        T_BROAD
      );
      tl.fromTo(
        underline,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
        T_BROAD + 0.02
      );

      tl.seek(0);
    })();
  </script>
</template>
