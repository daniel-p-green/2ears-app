  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var PRI = "#64D2FF";
      var NEG = "#FF9F0A";

      var $ = function (id) { return document.getElementById("03-the-ring-" + id); };
      var watch = $("watch");
      var fill = $("fill");
      var tick = $("tick");
      var num = $("num");
      var numwrap = $("numwrap");
      var suffix = $("suffix");
      var label = $("label");
      var glowCyan = $("glow-cyan");
      var glowOrange = $("glow-orange");
      var pulses = [$("pulse-1"), $("pulse-2"), $("pulse-3")];
      var caps = [$("cap-1"), $("cap-2"), $("cap-3"), $("cap-4")];

      // svg-path-draw setup: measured circumference, dash shifted fully out of view
      var C = fill.getTotalLength() || 2 * Math.PI * 142;
      fill.style.strokeDasharray = C + "";
      fill.style.strokeDashoffset = C + "";

      var share = { v: 0 };
      var setNum = function () { num.textContent = String(Math.round(share.v)); };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["03-the-ring"] = tl;

      // number and ring fill share position + duration + ease so they land as one beat
      var fillTo = function (target, dur, ease, at) {
        tl.to(share, { v: target, duration: dur, ease: ease, onUpdate: setNum }, at);
        tl.to(fill, { strokeDashoffset: C * (1 - target / 100), duration: dur, ease: ease }, at);
      };

      // caption line change: cut-the-curve style swap (Z-scale + blur + opacity)
      var swapCap = function (fromEl, toEl, at) {
        tl.to(fromEl, { opacity: 0, scale: 1.05, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, at);
        tl.fromTo(toEl,
          { opacity: 0, scale: 0.95, filter: "blur(6px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "power2.out" },
          at + 0.08);
      };

      var pulse = function (el, at, dur) {
        tl.fromTo(el,
          { opacity: 0.42, scale: 0.85 },
          { opacity: 0, scale: 1.6, duration: dur, ease: "power2.out" },
          at);
      };

      // ---- Scene 1 (0.0–2.6s): watch holds, ring draws to 30%, value counts up ----
      tl.fromTo(watch, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 0);
      tl.fromTo(caps[0], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.35);

      tl.fromTo(fill, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 0.5);
      fillTo(30, 1.8, "power2.out", 0.5);
      tl.fromTo(label, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.9);
      tl.to(tick, { opacity: 0.7, duration: 0.4, ease: "power1.out" }, 1.8);
      tl.fromTo(suffix, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)" }, 2.3);

      // ---- Scene 2 (2.6–4.8s): fill crosses the 40% tick (~3.46s), turns orange, one pulse ----
      fillTo(52, 1.8, "power2.inOut", 2.6);
      var T_UP = 3.46;
      tl.to(fill, { attr: { stroke: NEG }, duration: 0.35, ease: "power1.inOut" }, T_UP);
      tl.to(numwrap, { color: NEG, duration: 0.35, ease: "power1.inOut" }, T_UP);
      tl.to(glowCyan, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, T_UP);
      tl.to(glowOrange, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, T_UP);
      pulse(pulses[0], T_UP, 0.9);
      swapCap(caps[0], caps[1], 3.52);

      // ---- Scene 3 (4.8–6.6s): nudge 52→58, double tap = two quick pulses ----
      fillTo(58, 0.7, "power2.out", 4.9);
      swapCap(caps[1], caps[2], 5.5);
      pulse(pulses[1], 5.55, 0.8);
      pulse(pulses[2], 5.75, 0.8);

      // ---- Scene 4 (6.6–9.0s): drain 58→34 on a long power3 tail, back under (~7.4s), orange → cyan ----
      fillTo(34, 1.9, "power3.out", 6.7);
      var T_DOWN = 7.4;
      tl.to(fill, { attr: { stroke: PRI }, duration: 0.5, ease: "power1.inOut" }, T_DOWN);
      tl.to(numwrap, { color: PRI, duration: 0.5, ease: "power1.inOut" }, T_DOWN);
      tl.to(glowOrange, { opacity: 0, duration: 0.6, ease: "power1.inOut" }, T_DOWN);
      tl.to(glowCyan, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, T_DOWN);
      swapCap(caps[2], caps[3], 7.7);
      tl.to(caps[3], { opacity: 0, duration: 0.5, ease: "power1.out" }, 8.6);

      // subtle ambient drift on the watch across the whole shot (no pulse at rest)
      tl.to(watch, { y: -3, duration: 4.8, ease: "sine.inOut" }, 0);
      tl.to(watch, { y: 0, duration: 4.8, ease: "sine.inOut" }, 4.8);
    })();
  </script>
